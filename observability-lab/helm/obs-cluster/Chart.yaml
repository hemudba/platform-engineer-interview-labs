apiVersion: v2
name: obs-cluster-grafana
description: |
  Platform observability cluster — central Grafana + Alertmanager owned by the platform team.
  Grafana visualizes metrics pulled from workload Prometheus datasources.
  Alertmanager is the single alert-routing point; workload clusters disable their own
  Alertmanager and forward firing alerts here instead.
type: application
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts
  # INTERVIEW: Alertmanager lives here, not on workload clusters.
  # One place for silences, inhibition rules, and receiver config (PagerDuty / Slack).
  # Workload clusters disable their Alertmanager via values-dual-cluster.yaml and set
  # alertmanager.alertmanagerSpec.alertmanagerConfigSelector to forward to this endpoint.
  # Run: helm dependency build (refreshes Chart.lock + charts/alertmanager-*.tgz)
  - name: alertmanager
    version: 1.14.0
    repository: https://prometheus-community.github.io/helm-charts
