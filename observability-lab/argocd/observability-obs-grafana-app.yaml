---
# INTERVIEW: Central Grafana — chart from grafana Helm repo + values from Git.
# One Application = one Helm release. Pair with observability-obs-alertmanager-app.yaml on the obs cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-obs-grafana
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    env: lab
    observability: obs
    component: grafana
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: "10.5.15"
      helm:
        releaseName: central-grafana
        valueFiles:
          - $values/observability-lab/helm/obs-cluster/values-grafana-argocd.yaml
    - repoURL: https://github.com/hemudba/platform-engineer-interview-labs
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        argocd.argoproj.io/instance: observability-obs-grafana
        env: lab
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
